server:
  port: 8081

spring:
  application:
    name: workflow-registry
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/workflow_registry?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:platform}
    password: ${MYSQL_PASSWORD:platform}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:platform}
    password: ${RABBITMQ_PASSWORD:platform}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

platform:
  messaging:
    exchange: platform.events
  outbox:
    poll-interval-ms: 2000
    batch-size: 50
  internal:
    hmac-enabled: true
    hmac-secret: ${PLATFORM_INTERNAL_HMAC_SECRET:change-me-in-production}
    max-timestamp-skew-seconds: 300
  github:
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
    ready-label: agent:ready
  n8n:
    task-state-webhook-url: ${N8N_TASK_STATE_WEBHOOK_URL:}
  dashboard:
    allowed-origins: ${DASHBOARD_ALLOWED_ORIGINS:http://localhost:5173}
  bridge:
    base-url: ${BRIDGE_BASE_URL:http://localhost:8082}
  agent:
    repo-url: ${AGENT_REPO_URL:}
    default-ref: ${REPO_DEFAULT_REF:main}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
